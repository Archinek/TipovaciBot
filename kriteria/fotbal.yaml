sport: fotbal
poznamka: "Hlavní trhy (1X2) mají minimální value. Zaměřit se výhradně na fauly, karty, střely a BetBuildery."
kriteria:
  - {id: rozhodci_vliv, w: 3, typ: kontext, trhy: [karty, fauly], co: "Historická statistika rozhodčího (počet karet/faulů). Je přísný nebo pouští hru?"}
  - {id: formace_a_styl, w: 2, typ: kontext, trhy: [strely, rohy], co: "Změna formace ovlivňující produkci střel a křídelních útoků."}
  - {id: ignoruj_vysoky_kurz, w: 3, typ: veto, trhy: [vse], co: "NEZAMÍTEJ sázku kvůli vysokému kurzu (např. nad 3.00), pokud matematický model ukazuje value. Hledáme okrajové asymetrie."}
  - {id: korelace_builder, w: 2, typ: kontext, trhy: [builder], co: "Silná korelace mezi střelami, držením míče a rohy u dominantních týmů."}
  - {id: potvrzena_sestava, w: 3, typ: veto, co: "Oficiální sestavy (60-75 min před výkopem): chybí klíčoví hráči oproti běžné jedenáctce?"}
  - {id: zraneni_a_suspendace, w: 3, typ: veto, co: "Absence nejlepšího střelce, stoperů, defenzivního záložníka; hráči v trestu po kartách."}
