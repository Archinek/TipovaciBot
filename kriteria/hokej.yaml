sport: hokej
poznamka: "Zaměřit se na korelace v BetBuilderech (tresty + góly) a individuální hráčské statistiky (střely na branku, kanadské body)."
kriteria:
  - {id: korelace_tresty_goly, w: 3, typ: kontext, trhy: [builder], co: "Hledej korelaci v BetBuilderu: Týmy s vysokým počtem trestů a zároveň vysokou úspěšností přesilovek generují obrovskou value na Over góly + Over tresty."}
  - {id: ignoruj_vysoky_kurz_builder, w: 3, typ: veto, trhy: [builder], co: "NEZAMÍTEJ BetBuilder sázky kvůli vyššímu kurzu. Pokud Gaussova kopule v doplnkove.py ukazuje matematickou hranu (edge), kurz je správný a bereme ho."}
  - {id: startujici_brankar, w: 3, typ: veto, co: "Potvrzený startující brankář (jednička vs. záloha), brankář po zranění."}
  - {id: b2b_unava, w: 3, typ: veto, co: "Back-to-back (dva zápasy ve dvou dnech) a třetí zápas ve čtyřech dnech."}
  - {id: zraneni_klicovych, w: 3, typ: veto, co: "Absence top centra, obránců první dvojice, kapitána; stav v kádru."}
  - {id: sestava_lajny, w: 2, typ: veto, co: "Potvrzená sestava a lajny, rozcvičení, změny z tréninku."}
  - {id: presilovky_pp_pk, w: 2, typ: kontext, co: "Úspěšnost přesilovek a oslabení obou týmů."}
