name: Ranni Sportovni Report (TipovaciBot)

on:
  schedule:
    - cron: '0 5 * * *'
  repository_dispatch:
    types: [spustit_bota]
  workflow_dispatch:
    inputs:
      resend_wa_only:
        description: 'Pouze ZNOVU ODESLAT zprávu na WhatsApp z dnešního hotového reportu (bez stahování)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  analyzuj-zalohuj-a-publikuj:
    runs-on: ubuntu-latest
    env:
      TZ: 'Europe/Prague'

    steps:
      - name: 1. Stazeni repozitare a archivu
        uses: actions/checkout@v4

      - name: 2. Nastaveni Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Instalace knihoven a prohlizece Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          playwright install chromium --with-deps

      - name: 4. Spusteni TipovaciBot
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WA_INSTANCE_ID: ${{ secrets.WA_INSTANCE_ID }}
          WA_API_TOKEN: ${{ secrets.WA_API_TOKEN }}
          WA_GROUP_ID: ${{ secrets.WA_GROUP_ID }}
          GITHUB_PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          RESEND_WA_ONLY: ${{ inputs.resend_wa_only }}
        run: FORCE_RUN=1 python -m bot.main morning

      - name: 5. Ulozeni HTML reportu, zalohy a chyb na GitHub
        run: |
          git config user.name "TipovaciBot"
          git config user.email "bot@tipovacibot.local"
          touch lekce_z_chyb.txt
          mkdir -p data archiv docs
          git add -A
          git diff --staged --quiet || git commit -m "📊 Novy report a vyhodnoceni $(date +'%Y-%m-%d')"
          git push
