name: Uzavírací kurzy (CLV)

on:
  schedule:
    - cron: "*/30 6-22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bot-data
  cancel-in-progress: false

jobs:
  closing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pyyaml
      - name: Uložit uzavírací kurzy
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m bot.main closing
      - name: Uložit data do repozitáře
        run: |
          git config user.name "tipovaci-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "bot: closing $(date -u +%FT%H:%M)"
            git pull --rebase
            git push
          fi
