name: Ranní report

on:
  schedule:
    # Dva časy kvůli letnímu/zimnímu času (07:00 v Praze). Kód sám pozná, kdy je ranní okno,
    # a druhý běh téhož dne přeskočí (idempotence podle data/picks_DATUM.json).
    - cron: "0 5 * * *"
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      akce:
        description: "Co spustit"
        type: choice
        default: morning
        options: [morning, resend, sports, settle, backtest, builder, fortuna_probe, vysledky_probe, fortuna]
      args:
        description: "backtest: kód ligy (E0) nebo all. builder: soccer_epl|Arsenal|Chelsea|karty>4.5,rohy>9.5|3.4|Rozhodčí"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: bot-data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Spustit bota
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WA_INSTANCE_ID: ${{ secrets.WA_INSTANCE_ID }}
          WA_API_TOKEN: ${{ secrets.WA_API_TOKEN }}
          WA_GROUP_ID: ${{ secrets.WA_GROUP_ID }}
          WA_API_URL: ${{ vars.WA_API_URL }}
          PAGES_URL: ${{ vars.PAGES_URL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          TZ: Europe/Prague
          AKCE: ${{ github.event.inputs.akce || 'morning' }}
          ARGS: ${{ github.event.inputs.args }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python -m bot.main "$AKCE" "$ARGS"
      - name: Report ke stažení (záloha, kdyby nešly GitHub Pages)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ github.run_number }}
          path: docs/reports/*.html
          if-no-files-found: ignore
          retention-days: 30
      - name: Uložit data do repozitáře
        run: |
          git config user.name "tipovaci-bot"
          git config user.email "bot@users.noreply.github.com"
          touch lekce_z_chyb.txt
          git add data docs archiv lekce_z_chyb.txt
          if ! git diff --cached --quiet; then
            git commit -m "bot: data $(date -u +%F)"
            git pull --rebase
            git push
          fi
